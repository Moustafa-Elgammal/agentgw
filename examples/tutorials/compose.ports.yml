# Moves the published host ports, so a verification script never collides with a stack you
# already run. The tutorial scripts add this file; you do not need it.
#
#   TUTORIAL_PORT=18104 TUTORIAL_OPS_PORT=19104 docker compose -f docker-compose.yml \
#     -f examples/tutorials/compose.ports.yml up -d gateway
services:
  gateway:
    ports: !override
      - "127.0.0.1:${TUTORIAL_PORT:-8080}:8080"
      - "127.0.0.1:${TUTORIAL_OPS_PORT:-9091}:9091"

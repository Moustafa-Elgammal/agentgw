# Two tools that run inside the game client (the console game or a Unity game), not on a
# REST backend. backend: relay sends the call down the player's WebSocket.
version: 1
game: relay-demo
tools:
  - name: get_state
    description: The game's wood and farm counts. Call this first.
    tier: read
    backend: relay

  - name: build_farm
    description: Build a farm. A farm costs 5 wood.
    tier: medium
    backend: relay

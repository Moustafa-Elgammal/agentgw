{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentgw.fullname" . }}
  labels:
    {{- include "agentgw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentgw.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egressTo }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - { port: 8080, protocol: TCP }
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.networkPolicy.opsFrom }}
    - ports:
        - { port: {{ $.Values.ops.port }}, protocol: TCP }
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- with .Values.networkPolicy.egressTo }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

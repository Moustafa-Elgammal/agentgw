# Default values for the agentgw chart. Secrets are never set here: point existingSecret at a
# Secret you manage (sealed-secrets, external-secrets, or kubectl create secret).

image:
  repository: ghcr.io/moustafa-elgammal/agentgw
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# More than one replica needs a shared Redis (policy) and Postgres (confirmations, auth,
# manifests, audit). Without them each replica keeps its own limits and state.
replicaCount: 2

config:
  tenant: default
  # Public base URL of this gateway: the OAuth issuer, and the MCP resource is <publicURL>/mcp.
  publicURL: https://agentgw.example.com
  # Base URL of the game backend that receives signed calls.
  backendURL: http://game-backend.default.svc:8080
  # Allow the backend URL to resolve to private or loopback addresses. Leave false in production
  # unless the backend really lives on a private network (it usually does in a cluster: set true
  # deliberately).
  backendAllowPrivate: false
  # The most any player may grant: coach (read only) or operator. Empty means operator.
  # Recommended for a first pilot: coach. Raise it to operator once coach has been quiet.
  maxScope: operator
  # Largest request body in bytes (the gateway default is 1048576). OAuth and studio endpoints
  # keep their lower caps and manifest upload its own.
  maxBody: 1048576
  keyID: gateway-1
  studioKeyID: studio-1
  adminKeyID: admin-1
  redisAddr: ""           # for example redis-master.cache.svc:6379
  auditRetention: 720h    # 0 keeps audit events forever
  manifestPoll: 15s
  relayTicketTTL: 60s
  clientIPHeader: ""      # set ONLY behind a proxy that overwrites it, for example X-Forwarded-For
  registerPerHour: 10
  maxClients: 10000
  extraArgs: []           # extra gateway flags, one per item

# Sign in with the studio's own identity provider at the consent page (OIDC). Off while issuer is
# empty. Register <config.publicURL>/authorize/oidc/callback as the redirect URI at the provider,
# and put the two secrets in existingSecret (see below). The gateway refuses to start if the
# provider cannot be reached, so a wrong issuer shows up at deploy time. See docs/RUNBOOK.md.
oidc:
  issuer: ""            # for example https://login.example.com
  clientId: ""
  playerClaim: sub      # a claim that is stable for a person for ever and equals your player id
  scopes: openid
  algs: "RS256,ES256"   # asymmetric only
  publicClient: false   # true: the client is registered without a secret (PKCE only); then leave oidc-client-secret out

# Seed manifest, used only when the manifest store has no active version. After that the store
# (uploads through /v1/studio/manifest) is the source of truth. Give the manifest inline, or
# name an existing ConfigMap that holds the key named by manifestFile.
# The gateway picks the format from the file name: .yaml or .yml is YAML, anything else is JSON.
# YAML is the recommended authoring format. For an inline JSON manifest set manifestFile to
# manifest.json.
manifest: ""
manifestFile: manifest.yaml
existingManifestConfigMap: ""

# One Secret holding the credentials. Keys:
#   signing-secret  required   AGENTGW_SIGNING_SECRET (studio key and backend signing)
#   admin-secret    optional   AGENTGW_ADMIN_SECRET (mounts the manifest and admin feed endpoints)
#   relay-secret    optional   AGENTGW_RELAY_SECRET (enables the relay)
#   postgres-url    optional   AGENTGW_POSTGRES_URL
#   oidc-client-secret   required when oidc.issuer is set (not with publicClient)   AGENTGW_OIDC_CLIENT_SECRET
#   oidc-session-secret  required when oidc.issuer is set   AGENTGW_OIDC_SESSION_SECRET (32 bytes or more)
existingSecret: ""

# Optional Secret with key files for rotation. Keys studio-keys.json and admin-keys.json are
# mounted under /etc/agentgw/keys and reloaded on SIGHUP (see docs/RUNBOOK.md).
keyFilesSecret: ""

service:
  type: ClusterIP
  port: 80

ops:
  port: 9090   # /healthz, /readyz, /metrics. Not exposed through the Service or Ingress

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: agentgw.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
terminationGracePeriodSeconds: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}   # for example release: kube-prometheus-stack

networkPolicy:
  enabled: false
  # Who may reach the public port. Empty means any source.
  ingressFrom: []
  # Who may scrape the ops port, for example [{namespaceSelector: {matchLabels: {name: monitoring}}}].
  # Empty means no one but probes from the node (kubelet traffic is not filtered).
  opsFrom: []
  # Where the gateway may connect. Empty egress rules allow all egress, so set these when enabled.
  egressTo: []

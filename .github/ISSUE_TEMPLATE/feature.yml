name: Feature request
description: Propose a change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

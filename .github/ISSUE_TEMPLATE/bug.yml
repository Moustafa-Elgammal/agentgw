name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security problems here. Use a private advisory (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `gateway --version` or the image tag
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Prefer the demo (`docker compose up`) or a manifest that shows it.
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove secrets and tokens first.
      render: shell

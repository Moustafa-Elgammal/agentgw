name: k8s-tutorial

# Runs tutorial 9 (the Helm chart on a local Kubernetes cluster) in a kind cluster. It is slow and
# needs a cluster, so it runs weekly and on demand, not on every push.
on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k8s-tutorial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutorial-9:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a kind cluster
        run: |
          curl -sSfL -o kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind create cluster --name agentgw-ci --wait 120s
      - name: Run tutorial 9
        env:
          K8S_CONTEXT: kind-agentgw-ci
        run: make k8s-tutorial-check
      - name: Show the cluster when it failed
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl -n agentgw-tutorial describe pods || true
          kubectl -n agentgw-tutorial logs -l app.kubernetes.io/name=agentgw --tail=80 || true

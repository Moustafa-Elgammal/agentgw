name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentgw
          POSTGRES_PASSWORD: agentgw-dev
          POSTGRES_DB: agentgw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentgw -d agentgw" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      AGENTGW_TEST_REDIS_ADDR: 127.0.0.1:6379
      AGENTGW_TEST_POSTGRES_URL: postgres://agentgw:agentgw-dev@127.0.0.1:5432/agentgw?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and attach files
      packages: write # push images to GHCR
      id-token: write # keyless cosign signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Binaries, checksums, archive SBOMs and signatures
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - id: meta-agentgw
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/moustafa-elgammal/agentgw
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: push-agentgw
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          # The same version string the binaries print (GoReleaser strips the v): 0.1.0, not v0.1.0.
          build-args: VERSION=${{ steps.meta-agentgw.outputs.version }}
          tags: ${{ steps.meta-agentgw.outputs.tags }}
          labels: ${{ steps.meta-agentgw.outputs.labels }}
      - name: Sign agentgw by digest
        env:
          DIGEST: ${{ steps.push-agentgw.outputs.digest }}
        run: cosign sign --yes "ghcr.io/moustafa-elgammal/agentgw@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/moustafa-elgammal/agentgw
          subject-digest: ${{ steps.push-agentgw.outputs.digest }}
          push-to-registry: true
      - name: SBOM for agentgw
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/moustafa-elgammal/agentgw@${{ steps.push-agentgw.outputs.digest }}
          format: spdx-json
          output-file: agentgw-image.spdx.json
          upload-release-assets: true

      - id: meta-agentgw-bridge
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/moustafa-elgammal/agentgw-bridge
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: push-agentgw-bridge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: bridge
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta-agentgw-bridge.outputs.version }}
          tags: ${{ steps.meta-agentgw-bridge.outputs.tags }}
          labels: ${{ steps.meta-agentgw-bridge.outputs.labels }}
      - name: Sign agentgw-bridge by digest
        env:
          DIGEST: ${{ steps.push-agentgw-bridge.outputs.digest }}
        run: cosign sign --yes "ghcr.io/moustafa-elgammal/agentgw-bridge@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/moustafa-elgammal/agentgw-bridge
          subject-digest: ${{ steps.push-agentgw-bridge.outputs.digest }}
          push-to-registry: true
      - name: SBOM for agentgw-bridge
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/moustafa-elgammal/agentgw-bridge@${{ steps.push-agentgw-bridge.outputs.digest }}
          format: spdx-json
          output-file: agentgw-bridge-image.spdx.json
          upload-release-assets: true

name: docs-quality

# Prose and site quality gates, all run in containers through make: em dash check, Markdown lint,
# spell check, the site build with link validation, and an accessibility and layout audit of the
# built pages (axe WCAG 2 A and AA, no horizontal scroll, light and dark, desktop and phone).
on:
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "AGENTS.md"
      - "examples/**/README.md"
      - ".markdownlint-cli2.jsonc"
      - ".codespellrc"
      - ".codespell-ignore.txt"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_AUDIT_OUT: ${{ github.workspace }}/site/audit/out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the documentation quality gates
        run: make docs-quality

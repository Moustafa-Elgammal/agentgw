name: dco
on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Every commit carries a Signed-off-by that matches its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git show -s --format=%ae "$c")
            if ! git show -s --format=%B "$c" | grep -qiF "Signed-off-by: " ||
               ! git show -s --format=%B "$c" | grep -i "^Signed-off-by: " | grep -qiF "<$email>"; then
              echo "::error::commit $c needs 'Signed-off-by: Name <$email>' (git commit -s)"
              bad=1
            fi
          done
          exit $bad

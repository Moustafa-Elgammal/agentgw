name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Real Redis and Postgres, so the store contract suites run instead of skipping.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentgw
          POSTGRES_PASSWORD: agentgw-dev
          POSTGRES_DB: agentgw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentgw -d agentgw" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      AGENTGW_TEST_REDIS_ADDR: 127.0.0.1:6379
      AGENTGW_TEST_POSTGRES_URL: postgres://agentgw:agentgw-dev@127.0.0.1:5432/agentgw?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

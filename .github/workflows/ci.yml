name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Real Redis and Postgres, so the store contract suites run instead of skipping.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentgw
          POSTGRES_PASSWORD: agentgw-dev
          POSTGRES_DB: agentgw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentgw -d agentgw" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      AGENTGW_TEST_REDIS_ADDR: 127.0.0.1:6379
      AGENTGW_TEST_POSTGRES_URL: postgres://agentgw:agentgw-dev@127.0.0.1:5432/agentgw?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true # scan with the newest patch so stdlib fixes are picked up
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          bad=0
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git show -s --format=%B "$c" | grep -q '^Signed-off-by: ' || { echo "missing sign-off: $c"; bad=1; }
          done
          exit $bad

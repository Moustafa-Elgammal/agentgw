name: agentgw

x-dev-secret: &secret AGENTGW_SIGNING_SECRET=${AGENTGW_SIGNING_SECRET:-dev-secret}

services:
  # Toolchain container. Use it for every go, make, lint and vuln command:
  #   docker compose run --rm dev make test
  dev:
    build: { context: ., target: dev }
    profiles: [tools]
    working_dir: /src
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      - *secret
      - AGENTGW_TEST_REDIS_ADDR=redis:6379
      - AGENTGW_TEST_POSTGRES_URL=postgres://agentgw:agentgw-dev@postgres:5432/agentgw?sslmode=disable
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # Regenerates docs/THIRD-PARTY-LICENSES.md and fails on a license outside the allowed set:
  #   docker compose run --rm licenses
  licenses:
    image: golang:1.26-bookworm
    profiles: [tools]
    working_dir: /src
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    entrypoint: ["sh", "scripts/licenses.sh"]

  # Shared policy store (rate limits, caps, cooldowns, kill switches). Not published to the host.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    expose:
      - "6379"

  # Confirmations live here. Dev credentials only, not published to the host.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentgw
      POSTGRES_PASSWORD: agentgw-dev
      POSTGRES_DB: agentgw
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgw -d agentgw"]
      interval: 2s
      timeout: 2s
      retries: 20
    expose:
      - "5432"

  # docker compose up --build   -> dev API on http://127.0.0.1:8080 (loopback only)
  gateway:
    build: { context: ., target: gateway }
    command:
      - --manifest=/etc/agentgw/manifest.yaml
      - --backend-url=http://city-backend:9090
      - --backend-allow-private   # the backend is on the compose network; dev only
      - --addr=0.0.0.0:8080
      - --redis-addr=redis:6379
      - --ops-addr=0.0.0.0:9091   # /healthz /readyz /metrics, published on loopback only
      # Demo mode: trust the X-Dev-Player header and serve the dev API. To try real OAuth,
      # delete this line (the issuer defaults to http://127.0.0.1:8080; the studio signing
      # key id is --studio-key-id, secret AGENTGW_SIGNING_SECRET). See README, "OAuth flow".
      - --dev-auth
    environment:
      - *secret
      - AGENTGW_POSTGRES_URL=postgres://agentgw:agentgw-dev@postgres:5432/agentgw?sslmode=disable
    volumes:
      - ./examples/city:/etc/agentgw:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9091:9091"
    depends_on:
      city-backend: { condition: service_started }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # Load and soak driver (needs the gateway running with --dev-auth):
  #   docker compose up -d --build gateway
  #   docker compose run --rm load --url http://gateway:8080 --duration 30s --rate 200
  load:
    build: { context: ., target: dev }
    profiles: [tools]
    working_dir: /src
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    entrypoint: ["go", "run", "./test/load"]

  # Chart and monitoring checks, no host install:
  #   docker compose run --rm helm lint /deploy/helm/agentgw
  helm:
    image: alpine/helm:3.16.4
    profiles: [tools]
    volumes:
      - ./deploy:/deploy:ro

  #   docker compose run --rm promtool check rules /deploy/prometheus/alerts.yaml
  promtool:
    image: prom/prometheus:v2.55.1
    profiles: [tools]
    entrypoint: ["promtool"]
    volumes:
      - ./deploy:/deploy:ro

  # Release tooling, no host install. The snapshot build needs no tokens and publishes nothing:
  #   docker compose run --rm release check
  #   docker compose run --rm release release --snapshot --clean --skip=publish,sign,sbom
  # (syft and cosign are not in this image, so the snapshot skips sbom and sign.)
  release:
    image: goreleaser/goreleaser:v2.20.2
    profiles: [tools]
    working_dir: /src
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      - GOFLAGS=-buildvcs=false

  # Project site (Astro Starlight), no host install. Node runs only here:
  #   docker compose run --rm site build            # site/dist
  #   docker compose run --rm site check            # build, warnings are errors, link check
  #   docker compose run --rm site dev              # http://127.0.0.1:4321/agentgw/
  #   docker compose run --rm site check-external   # external links (skips when offline)
  #   docker compose run --rm site lock             # regenerate package-lock.json
  site:
    build: { context: ./site }
    profiles: [tools]
    volumes:
      - .:/repo
      - site-node-modules:/repo/site/node_modules
    ports:
      - "127.0.0.1:4321:4321"

  # Signature verifier examples, one per language. Each checks the shared test vector
  # (examples/signing/vector.json), a tampered request and a replayed idempotency key:
  #   docker compose run --rm sig-go | sig-python | sig-typescript | sig-csharp
  sig-go:
    image: golang:1.26-bookworm
    profiles: [tools]
    working_dir: /src
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    command: ["go", "test", "-race", "-count=1", "./examples/signing/go/..."]

  sig-python:
    image: python:3.13-slim
    profiles: [tools]
    working_dir: /s/python
    volumes:
      - ./examples/signing:/s:ro
    command: ["python", "-B", "-m", "unittest", "-v"]

  sig-typescript:
    image: node:22-slim
    profiles: [tools]
    working_dir: /s/typescript
    volumes:
      - ./examples/signing:/s:ro
    command: ["node", "--experimental-strip-types", "--no-warnings", "--test"]

  sig-csharp:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: [tools]
    environment:
      - DOTNET_NOLOGO=1
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
    volumes:
      - ./examples/signing:/s:ro
    # Copied to /tmp so the read-only source tree stays clean.
    command: ["sh", "-c", "cp -r /s /tmp/s && cd /tmp/s/csharp && dotnet run"]

  #   docker compose run --rm actionlint
  actionlint:
    image: rhysd/actionlint:1.7.7
    profiles: [tools]
    working_dir: /repo
    volumes:
      - .:/repo:ro
    entrypoint: ["actionlint", "-color"]

  # Build only: docker compose build bridge. Desktop clients launch it with docker run -i
  # (see README, "Use the gateway from Claude Desktop").
  bridge:
    build: { context: ., target: bridge }
    image: agentgw-bridge:latest
    profiles: [tools]

  city-backend:
    build: { context: ., target: city-backend }
    environment:
      - *secret
      - BACKEND_ADDR=0.0.0.0:9090
    expose:
      - "9090"

volumes:
  pg-data:
  go-mod:
  go-build:
  site-node-modules:
